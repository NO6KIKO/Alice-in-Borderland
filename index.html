<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night Compound</title>
<style>
  html,body{margin:0;height:100%;background:#05080d;overflow:hidden;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#dfe6ee}
  canvas{display:block}
  #markers{position:fixed;inset:0;pointer-events:none}
  .mk{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#fff;color:#000;
      font:700 13px/24px "Segoe UI",sans-serif;text-align:center;border:2px solid #000;box-shadow:0 0 0 1.5px #fff;
      pointer-events:auto;cursor:pointer;user-select:none;transition:opacity .2s}
  .mk:hover{background:#ffd24a}
  #hud{position:fixed;left:16px;top:16px;background:rgba(8,12,18,.72);border:1px solid #2a3442;border-radius:8px;padding:12px 14px;backdrop-filter:blur(6px);max-width:230px}
  #hud h1{margin:0 0 8px;font-size:14px;letter-spacing:.08em}
  #hud li{list-style:none;font-size:12.5px;line-height:1.9;cursor:pointer}
  #hud li b{display:inline-block;width:20px;height:20px;border-radius:50%;background:#fff;color:#000;text-align:center;line-height:20px;font-size:11px;margin-right:8px}
  #hud li:hover{color:#ffd24a}
  #hud ul{margin:0;padding:0}
  #views{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px}
  #views button{background:rgba(8,12,18,.78);color:#dfe6ee;border:1px solid #2a3442;border-radius:6px;padding:7px 14px;cursor:pointer;font-size:12.5px}
  #views button:hover{border-color:#ffd24a;color:#ffd24a}
  #tip{position:fixed;right:16px;bottom:16px;font-size:11.5px;opacity:.55}
  #views button.play{border-color:#ffd24a;color:#ffd24a;font-weight:600}
  body.playing #markers,body.playing #views,body.playing #hud,body.playing #tip{display:none}
  #load{position:fixed;inset:0;background:#05080d;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:.2em;transition:opacity .6s}
</style>
<script type="importmap">
{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/","three-mesh-bvh":"./node_modules/three-mesh-bvh/build/index.module.js"}}
</script>
</head>
<body>
<div id="load">LOADING…</div>
<div id="markers"></div>
<div id="hud"><h1>夜间场地 · 区域索引</h1><ul id="legend"></ul></div>
<div id="views"></div>
<div id="tip">左键旋转 · 右键平移 · 滚轮缩放 · 点击编号飞入</div>
<script type="module" src="./main.js"></script>
</body>
</html>
